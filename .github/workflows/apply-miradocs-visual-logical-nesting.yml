name: Apply MiraDocs visual logical nesting

on:
  push:
    branches:
      - fix/miradocs-visual-logical-nesting
    paths:
      - .github/workflows/apply-miradocs-visual-logical-nesting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/miradocs-visual-logical-nesting
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source patch
        run: node .github/scripts/apply-miradocs-visual-logical-nesting.mjs
      - name: Remove one-shot patch machinery
        run: |
          rm .github/scripts/apply-miradocs-visual-logical-nesting.mjs
          rm .github/workflows/apply-miradocs-visual-logical-nesting.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: nest visual references under MiraDocs without moving routes"
          git push origin HEAD:fix/miradocs-visual-logical-nesting
