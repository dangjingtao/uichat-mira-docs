name: Diagnose MiraDocs install

on:
  push:
    branches:
      - chore/consume-miradocs-0.1.1

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/consume-miradocs-0.1.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture frozen install result
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile > /tmp/pnpm-install.log 2>&1
          STATUS=$?
          set -e
          {
            echo "status=${STATUS}"
            echo
            tail -n 120 /tmp/pnpm-install.log
          } > ci-install-diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-install-diagnostic.txt
          git commit -m "chore: capture pnpm install diagnostic"
          git push origin HEAD:chore/consume-miradocs-0.1.1
