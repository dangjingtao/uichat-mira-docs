name: Refresh MiraDocs lockfile

on:
  push:
    branches:
      - chore/consume-miradocs-0.1.1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/consume-miradocs-0.1.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh published package resolution
        run: pnpm install --lockfile-only --force
      - name: Prove frozen installation
        run: pnpm install --frozen-lockfile
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches the published package."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh MiraDocs 0.1.1 lockfile"
          git push origin HEAD:chore/consume-miradocs-0.1.1
