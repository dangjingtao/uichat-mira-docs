name: Apply encoded visual path guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/miradocs-visual-logical-nesting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact path guard
        run: node .github/scripts/fix-visual-active-path.mjs
      - name: Remove one-shot patch files
        run: |
          rm .github/scripts/fix-visual-active-path.mjs
          rm .github/workflows/apply-visual-active-path.yml
      - name: Commit guarded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve encoded visual routes for active navigation"
          git push origin HEAD:${{ github.head_ref }}
