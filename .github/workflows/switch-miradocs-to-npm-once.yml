name: Switch MiraDocs consumer to npm once

on:
  push:
    branches:
      - chore/use-npm-miradocs-20260726

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/use-npm-miradocs-20260726

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Replace Git preview dependency with npm release
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const packagePath = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'))
          pkg.dependencies['@uichat-mira/docs'] = '^0.1.0'
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n')

          const workspacePath = 'pnpm-workspace.yaml'
          const workspace = fs.readFileSync(workspacePath, 'utf8')
            .split(/\r?\n/)
            .filter((line) => !line.includes("'@uichat-mira/docs':"))
            .join('\n')
          fs.writeFileSync(workspacePath, workspace.replace(/\n+$/, '\n'))
          NODE

      - name: Generate registry lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

      - name: Confirm npm package resolution
        run: |
          pnpm list @uichat-mira/docs --depth 0
          grep -q "specifier: \^0.1.0" pnpm-lock.yaml
          grep -q "'@uichat-mira/docs@0.1.0'" pnpm-lock.yaml
          if grep -q "codeload.github.com/dangjingtao/mira-docs" pnpm-lock.yaml; then
            echo 'Git preview dependency remains in lockfile' >&2
            exit 1
          fi

      - name: Build GitHub Pages site
        run: pnpm run build:github-pages

      - name: Verify static output
        run: pnpm run verify:static-output

      - name: Commit verified registry dependency
        run: |
          rm .github/workflows/switch-miradocs-to-npm-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml pnpm-workspace.yaml .github/workflows/switch-miradocs-to-npm-once.yml
          git commit -m "chore: consume MiraDocs from npm"
          git push origin HEAD:chore/use-npm-miradocs-20260726
