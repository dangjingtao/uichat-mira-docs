name: Validate MiraDocs migration

on:
  push:
    branches:
      - codex/mira-docs-migration-20260725
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mira-docs-migration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify real MiraDocs content compatibility
        run: pnpm run verify:mira-docs
      - name: Build existing GitHub Pages site
        run: pnpm run build:github-pages
      - name: Verify generated static output
        env:
          EXPECTED_BASE: uichat-mira-docs
        run: pnpm run verify:static-output

  build-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-site

      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: codex/mira-docs-migration-20260725
          path: preview-site

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            main-site/pnpm-lock.yaml
            preview-site/pnpm-lock.yaml

      - name: Build production root from main
        working-directory: main-site
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:github-pages

      - name: Build migration branch under preview path
        working-directory: preview-site
        run: |
          pnpm install --frozen-lockfile
          pnpm run build -- --mode github-pages --base /uichat-mira-docs/preview/

      - name: Make preview non-indexable
        working-directory: preview-site
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, readdirSync, statSync } from "node:fs";
          import { resolve } from "node:path";

          const visit = (directory) => {
            for (const name of readdirSync(directory)) {
              const file = resolve(directory, name);
              if (statSync(file).isDirectory()) {
                visit(file);
                continue;
              }
              if (!name.endsWith(".html")) continue;
              const source = readFileSync(file, "utf8").replaceAll(
                '<meta name="robots" content="index,follow">',
                '<meta name="robots" content="noindex,nofollow">',
              );
              writeFileSync(file, source);
            }
          };
          visit(resolve("dist"));
          NODE

      - name: Assemble root and preview artifact
        run: |
          rm -rf main-site/dist/preview
          mkdir -p main-site/dist/preview
          cp -a preview-site/dist/. main-site/dist/preview/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: main-site/dist

  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - validate
      - build-preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy combined artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test deployed preview
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          PREVIEW_URL="${PAGE_URL%/}/preview/"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$PREVIEW_URL" \
              | grep --quiet 'id="root"'; then
              echo "Preview is reachable: $PREVIEW_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become reachable: $PREVIEW_URL" >&2
          exit 1
