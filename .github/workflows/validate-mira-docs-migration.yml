name: Validate MiraDocs migration

on:
  push:
    branches:
      - codex/mira-docs-migration-20260725
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mira-docs-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install migration dependency
        id: install
        continue-on-error: true
        shell: bash
        run: pnpm install --no-frozen-lockfile --reporter=append-only > mira-docs-install.log 2>&1
      - name: Upload install diagnostics
        if: steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mira-docs-install-log
          path: mira-docs-install.log
          if-no-files-found: error
      - name: Stop after installation failure
        if: steps.install.outcome == 'failure'
        run: exit 1
      - name: Verify real MiraDocs content compatibility
        id: verify
        continue-on-error: true
        shell: bash
        run: pnpm run verify:mira-docs > mira-docs-verify.log 2>&1
      - name: Upload compatibility diagnostics
        if: steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mira-docs-verify-log
          path: mira-docs-verify.log
          if-no-files-found: error
      - name: Stop after compatibility failure
        if: steps.verify.outcome == 'failure'
        run: exit 1
      - name: Build existing GitHub Pages site
        run: pnpm run build:github-pages
      - name: Commit refreshed lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: lock MiraDocs migration dependency [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
