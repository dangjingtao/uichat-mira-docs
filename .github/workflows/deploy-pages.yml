name: Deploy GitHub Pages
on:
  push:
    branches:
      - main
      - feat/works-comic-reader-experiment
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Mira dev truth source
        uses: actions/checkout@v4
        with:
          repository: dangjingtao/uichat-mira
          ref: dev
          path: .source/uichat-mira
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify current implementation freshness
        env:
          MIRA_SOURCE_PACKAGE: .source/uichat-mira/package.json
          MIRA_SOURCE_ROOT: .source/uichat-mira
        run: pnpm run verify:current-status
      - run: pnpm run build:github-pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-experiment' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
