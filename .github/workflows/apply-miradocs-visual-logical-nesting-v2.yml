name: Apply MiraDocs visual logical nesting from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/miradocs-visual-logical-nesting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source patch
        run: node .github/scripts/apply-miradocs-visual-logical-nesting.mjs
      - name: Remove one-shot patch machinery
        run: |
          rm .github/scripts/apply-miradocs-visual-logical-nesting.mjs
          rm .github/workflows/apply-miradocs-visual-logical-nesting.yml
          rm .github/workflows/apply-miradocs-visual-logical-nesting-v2.yml
          rm .github/workflows/README-visual-logical-nesting.tmp
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: nest visual references under MiraDocs without moving routes"
          git push origin HEAD:${{ github.head_ref }}
